<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SR Model Viewer</title>
<!-- SR Model Viewer (ADR-066): 3D viewer for vault models. Nothing it does changes the model file.
     Open with ?src=<url of a .glb>, or drop / pick a .glb file.
     Orbit, pan, zoom, select one or many parts, explode all or the selection, drag parts, hide and show,
     part tree. Moves and explodes are for looking only and reset with "Reset positions". -->
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --mute:#6b7383; --line:#d9dde4; --acc:#1f6feb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:280px; min-width:220px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #side header { padding:10px 12px; border-bottom:1px solid var(--line); }
  #side h1 { font-size:14px; margin:0 0 2px; }
  #file { color:var(--mute); font-size:12px; word-break:break-all; }
  #tools { padding:8px 12px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #tools label.row { grid-column:1/-1; display:flex; align-items:center; gap:8px; }
  #tools input[type=range] { flex:1; }
  button { font:inherit; padding:5px 8px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  #tree { flex:1; overflow:auto; padding:6px 4px 12px; }
  .node { display:flex; align-items:center; gap:4px; padding:2px 4px; border-radius:4px; white-space:nowrap; cursor:pointer; }
  .node:hover { background:#eef2f8; }
  .node.sel { background:#dbe8ff; }
  .node .tw { width:14px; text-align:center; color:var(--mute); }
  .node .nm { overflow:hidden; text-overflow:ellipsis; }
  .node.off .nm { color:#a7adb8; text-decoration:line-through; }
  .kids.closed { display:none; }
  #main { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #views { position:absolute; top:10px; right:10px; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  #hint { position:absolute; left:10px; bottom:10px; color:var(--mute); font-size:12px; background:rgba(255,255,255,.8); padding:4px 8px; border-radius:5px; }
  #drop { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--mute); }
  #drop.hide { display:none; }
  #err { color:#b42318; }
  button.on { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  #explodeLbl { color:var(--mute); font-size:12px; grid-column:1/-1; margin-top:-4px; }
  @media (max-width: 700px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; height:42%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <header><h1>SR Model Viewer</h1><div id="file">No model loaded</div></header>
    <div id="tools">
      <label class="row">Explode <input id="explode" type="range" min="0" max="100" value="0"></label>
      <div id="explodeLbl">Explodes the whole model</div>
      <button id="move" title="Drag parts with the mouse (M)">Move parts</button>
      <button id="multi" title="Tap to add parts to the selection (phones)">Multi-select</button>
      <button id="hideSel" disabled>Hide selected</button>
      <button id="isolate" disabled>Isolate</button>
      <button id="showAll">Show all</button>
      <button id="reset">Reset positions</button>
      <button id="fit">Fit</button>
      <button id="clear" disabled>Clear selection</button>
      <label class="row"><input id="hw" type="checkbox"> Hide hardware</label>
      <label class="row"><input id="edges" type="checkbox" checked> Edges</label>
      <button id="open" style="grid-column:1/-1">Open .glb…</button>
      <input id="pick" type="file" accept=".glb,.gltf" hidden>
    </div>
    <div id="tree"></div>
  </aside>
  <main id="main">
    <canvas id="c"></canvas>
    <div id="views">
      <button data-v="front">Front</button><button data-v="top">Top</button>
      <button data-v="right">Right</button><button data-v="iso">Iso</button>
    </div>
    <div id="drop"><div>Drop a .glb here, or use <b>Open .glb…</b></div><div id="err"></div></div>
    <div id="hint"></div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Same name rules as sheet2d.meshparts.is_hardware (keep the two in step).
const HW = /(^|[\s,(])(SBH|SHCS|SCH|BHCS|FHCS|FHS|FH|SO|SOS|BSO|TBSO|CSOS|NHX|NTN|NHR|NLN|NYL|WSL|WFL|WSP|PEM)[-\s]|\b(screws?|bolts?|nuts?|washers?|standoffs?|spacers?|rivets?|dowels?|heat[- ]?set|threaded insert)\b|\b(ISO|DIN)\s?\d{3,5}\b|^M\d+(\.\d+)?\s*[xX]\s*\d+/i;
const NOT_HW = /\b(plug|terminal|connector|conn|header|socket,|receptacle|recepticle|ball ?nuts?|ball ?screws?|lead ?screws?|plates?|housings?|brackets?|rails?)\b/i;
const isHardware = n => !!n && HW.test(n) && !NOT_HW.test(n);
const $ = id => document.getElementById(id);

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf4f5f7);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.001, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); scene.add(sun);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
controls.screenSpacePanning = true;

// parts: one entry per body. home = file position; k = explode amount; offset = dragged distance (parent space).
let model = null, parts = [], center = new THREE.Vector3(), size = 1;
const selected = new Set();
let moveMode = false, multiMode = false;
const edgeMat = new THREE.LineBasicMaterial({ color: 0x1d2330, transparent: true, opacity: 0.55 });
const selMat = new THREE.MeshStandardMaterial({ color: 0x1f6feb, emissive: 0x0a2a66, metalness: 0.1, roughness: 0.5 });
const partOf = new Map();

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function fitTo(box, dir) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length() || 1;
  const d = dir || camera.position.clone().sub(controls.target).normalize();
  const dist = s / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.1;
  controls.target.copy(c); camera.position.copy(c).addScaledVector(d, dist);
  camera.near = dist / 1000; camera.far = dist * 100; camera.updateProjectionMatrix();
}
function visibleBox() {
  const b = new THREE.Box3();
  for (const p of parts) if (p.mesh.visible) b.expandByObject(p.mesh);
  return b.isEmpty() ? new THREE.Box3().setFromObject(model) : b;
}
const VIEWS = { front: [0, 0, 1], top: [0, 1, 0.0001], right: [1, 0, 0], iso: [1, 0.8, 1] };
document.querySelectorAll('#views button').forEach(b => b.onclick = () => model && fitTo(visibleBox(), new THREE.Vector3(...VIEWS[b.dataset.v]).normalize()));

// Loading. Files are read in memory (no blob URLs), so this also works inside sandboxed pages.
const fail = e => { $('err').textContent = 'Could not open model: ' + (e && e.message || e); };
const done = label => gltf => { realNames(gltf); setModel(gltf.scene, label); };
function load(url, label) { $('err').textContent = ''; new GLTFLoader().load(url, done(label), undefined, fail); }
function loadBytes(buffer, label) { $('err').textContent = ''; new GLTFLoader().parse(buffer, '', done(label), fail); }
const loadFile = f => f.arrayBuffer().then(b => loadBytes(b, f.name), fail);

// The loader cleans names for animation use ("M3-0.5 x 8" -> "M3-05_x_8"); put the file's own names back.
function realNames(gltf) {
  const nodes = gltf.parser.json.nodes || [];
  gltf.scene.traverse(o => {
    const a = gltf.parser.associations.get(o);
    if (a && a.nodes !== undefined && nodes[a.nodes] && nodes[a.nodes].name) o.name = nodes[a.nodes].name;
  });
}
function setModel(root, label) {
  if (model) scene.remove(model);
  model = root; scene.add(model); parts = []; selected.clear(); partOf.clear();
  model.updateMatrixWorld(true);
  model.traverse(o => {
    if (!o.isMesh) return;
    o.material = o.material.clone(); o.userData.mat = o.material;
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 30), edgeMat);
    lines.raycast = () => {}; o.add(lines); o.userData.edges = lines;
    const p = { mesh: o, home: o.position.clone(), k: 0, offset: new THREE.Vector3(), name: partName(o),
                worldCenter: new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()) };
    parts.push(p); partOf.set(o, p);
  });
  const box = new THREE.Box3().setFromObject(model);
  box.getCenter(center); size = box.getSize(new THREE.Vector3()).length();
  $('file').dataset.label = label + ' · ' + parts.length + ' bodies';
  $('drop').classList.add('hide');
  buildTree(); applyHardware(); place(); selectionChanged();
  fitTo(box, new THREE.Vector3(...VIEWS.iso).normalize());
}
function partName(o) {
  for (let n = o; n; n = n.parent) if (n.name && !/^mesh_?\d*$/i.test(n.name)) return n.name;
  return o.name || 'part';
}

// Position = file position + explode push away from the model center + dragged offset.
function place(list = parts) {
  for (const p of list) {
    const dirW = p.worldCenter.clone().sub(center);
    if (dirW.lengthSq() < 1e-12) dirW.set(0, size * 0.05, 0);
    const parent = p.mesh.parent;
    const a = parent.worldToLocal(center.clone()), b = parent.worldToLocal(center.clone().add(dirW));
    p.mesh.position.copy(p.home).addScaledVector(b.sub(a), p.k).add(p.offset);
  }
}
// The slider explodes the selection when there is one, else the whole model.
function targets() { return selected.size ? [...selected].map(m => partOf.get(m)) : parts; }
$('explode').onchange = () => $('explode').blur();
$('explode').oninput = () => { const k = $('explode').value / 100 * 1.2; const t = targets(); t.forEach(p => p.k = k); place(t); };
$('reset').onclick = () => { parts.forEach(p => { p.k = 0; p.offset.set(0, 0, 0); }); place(); $('explode').value = 0; };

// Part tree: every named node with meshes under it. Box = shown. Click = select; Ctrl/Shift click adds.
const rows = new Map();
function buildTree() {
  const host = $('tree'); host.innerHTML = ''; rows.clear();
  const walk = (obj, el, depth) => {
    const kids = obj.children.filter(c => !c.isLineSegments && (c.isMesh || hasMesh(c)));
    const soleMesh = obj.isMesh && obj.parent && obj.parent.name && obj.parent.children.filter(c => c.isMesh).length === 1;
    let into = el;
    if (obj !== model && (obj.name || obj.isMesh) && !soleMesh) {
      const row = document.createElement('div'); row.className = 'node';
      row.style.paddingLeft = (4 + depth * 12) + 'px';
      row.innerHTML = '<span class="tw">' + (kids.length ? '▾' : '') + '</span><input type="checkbox" checked><span class="nm"></span>';
      row.querySelector('.nm').textContent = obj.name || 'body';
      row.title = obj.name || '';
      el.appendChild(row);
      const box = document.createElement('div'); box.className = 'kids'; el.appendChild(box);
      row.querySelector('.tw').onclick = e => { e.stopPropagation(); box.classList.toggle('closed'); row.querySelector('.tw').textContent = box.classList.contains('closed') ? '▸' : '▾'; };
      row.querySelector('input').onclick = e => { e.stopPropagation(); setShown(obj, e.target.checked); };
      row.onclick = e => select(meshesOf(obj), e.ctrlKey || e.metaKey || e.shiftKey || multiMode);
      rows.set(obj, row); into = box; depth++;
    }
    for (const c of kids) walk(c, into, depth);
  };
  walk(model, host, 0);
}
const hasMesh = o => { let f = false; o.traverse(c => { if (c.isMesh) f = true; }); return f; };
const meshesOf = o => { const m = []; o.traverse(c => { if (c.isMesh && c.visible) m.push(c); }); return m; };
function setShown(obj, on) { obj.traverse(c => { if (c.isMesh) { c.visible = on; if (!on) selected.delete(c); } }); selectionChanged(); }
function syncTree() {
  for (const [obj, row] of rows) {
    let any = false, all = true, n = 0;
    obj.traverse(c => { if (c.isMesh) { n++; if (c.visible) any = true; if (!selected.has(c)) all = false; } });
    row.querySelector('input').checked = any; row.classList.toggle('off', !any);
    row.classList.toggle('sel', n > 0 && all);
  }
}
function applyHardware() {
  const hide = $('hw').checked;
  for (const p of parts) if (isHardware(p.name)) { p.mesh.visible = !hide; if (hide) selected.delete(p.mesh); }
  selectionChanged();
}
$('hw').onchange = applyHardware;
$('edges').onchange = e => parts.forEach(p => p.mesh.userData.edges.visible = e.target.checked);

// Selection: plain click replaces; Ctrl/Shift/Cmd click (or Multi-select) toggles. Empty click clears.
function select(meshes, add) {
  meshes = meshes.filter(Boolean);
  if (!add) {
    const same = meshes.length && meshes.length === selected.size && meshes.every(m => selected.has(m));
    selected.clear();
    if (!same) meshes.forEach(m => selected.add(m));
  } else {
    const allIn = meshes.length && meshes.every(m => selected.has(m));
    meshes.forEach(m => allIn ? selected.delete(m) : selected.add(m));
  }
  selectionChanged();
}
function selectionChanged() {
  for (const p of parts) p.mesh.material = selected.has(p.mesh) ? selMat : p.mesh.userData.mat;
  const n = selected.size;
  $('hideSel').disabled = $('isolate').disabled = $('clear').disabled = !n;
  $('file').textContent = n === 1 ? partOf.get([...selected][0]).name : n ? n + ' parts selected' : ($('file').dataset.label || 'No model loaded');
  $('explodeLbl').textContent = n ? 'Explodes the ' + n + ' selected part' + (n > 1 ? 's' : '') : 'Explodes the whole model';
  const t = targets(); $('explode').value = Math.round((t[0] ? t[0].k : 0) / 1.2 * 100);
  syncTree(); hint();
}
$('clear').onclick = () => select([], false);
$('hideSel').onclick = () => { selected.forEach(m => m.visible = false); selected.clear(); selectionChanged(); };
$('isolate').onclick = () => { parts.forEach(p => p.mesh.visible = selected.has(p.mesh)); selectionChanged(); fitTo(visibleBox()); };
$('showAll').onclick = () => { parts.forEach(p => p.mesh.visible = true); $('hw').checked = false; selectionChanged(); };
$('fit').onclick = () => model && fitTo(visibleBox());
function setMove(on) { moveMode = on; $('move').classList.toggle('on', on); hint(); }
$('move').onclick = () => setMove(!moveMode);
$('multi').onclick = () => { multiMode = !multiMode; $('multi').classList.toggle('on', multiMode); };
function hint() {
  $('hint').textContent = moveMode
    ? 'Move: drag a part to move it and everything selected with it · Right / middle drag: pan · M: leave Move'
    : 'Left drag: orbit · Right / middle drag: pan · Wheel: zoom · Click: select · Ctrl/Shift click: add · Double-click: fit to part · M: Move';
}

// Pointer: a short click selects; in Move mode a drag on a part moves the selection in the screen plane.
const ray = new THREE.Raycaster();
const ndc = e => { const r = canvas.getBoundingClientRect(); return new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); };
function pick(e) {
  ray.setFromCamera(ndc(e), camera);
  const hit = ray.intersectObjects(parts.filter(p => p.mesh.visible).map(p => p.mesh), false)[0];
  return hit || null;
}
let down = null, drag = null;
canvas.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, button: e.button, add: e.ctrlKey || e.metaKey || e.shiftKey || multiMode };
  if (!moveMode || e.button !== 0) return;
  const hit = pick(e); if (!hit) return;
  if (!selected.has(hit.object)) select([hit.object], down.add);
  if (!selected.has(hit.object)) return;
  const normal = camera.getWorldDirection(new THREE.Vector3());
  drag = { plane: new THREE.Plane().setFromNormalAndCoplanarPoint(normal, hit.point), last: hit.point.clone(),
           list: [...selected].map(m => partOf.get(m)) };
  controls.enabled = false; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  ray.setFromCamera(ndc(e), camera);
  const at = ray.ray.intersectPlane(drag.plane, new THREE.Vector3()); if (!at) return;
  const dW = at.clone().sub(drag.last); drag.last.copy(at);
  for (const p of drag.list) {
    const parent = p.mesh.parent, o = parent.worldToLocal(new THREE.Vector3()), t = parent.worldToLocal(dW.clone());
    p.offset.add(t.sub(o));
  }
  place(drag.list);
});
canvas.addEventListener('pointerup', e => {
  const moved = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5;
  if (drag) { drag = null; controls.enabled = true; if (moved) { down = null; return; } }
  if (!down || down.button !== 0 || moved) { down = null; return; }
  const hit = pick(e); select(hit ? [hit.object] : [], down.add && !!hit); down = null;
});
canvas.addEventListener('dblclick', e => { const h = pick(e); if (h) fitTo(new THREE.Box3().setFromObject(h.object)); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && !['range', 'checkbox'].includes(e.target.type)) return;
  if (e.key === 'h' && selected.size) $('hideSel').click();
  if (e.key === 'Escape') select([], false);
  if (e.key === 'f') $('fit').click();
  if (e.key === 'm') setMove(!moveMode);
  if ((e.ctrlKey || e.metaKey) && e.key === 'a') { e.preventDefault(); select(parts.filter(p => p.mesh.visible).map(p => p.mesh), false); }
});

// Open a file: picker, drag and drop, or ?src=
$('open').onclick = () => $('pick').click();
$('pick').onchange = () => { const f = $('pick').files[0]; if (f) loadFile(f); };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
const src = new URLSearchParams(location.search).get('src');
if (src) load(src, decodeURIComponent(src.split('/').pop()));
if (window.SR_MODEL_B64) {
  const bin = Uint8Array.from(atob(window.SR_MODEL_B64), c => c.charCodeAt(0));
  loadBytes(bin.buffer, window.SR_MODEL_NAME || 'model.glb');
}

hint(); resize();
renderer.setAnimationLoop(() => {
  controls.update();
  sun.position.copy(camera.position).add(new THREE.Vector3(size, size, size));
  renderer.render(scene, camera);
});
</script>
</body>
</html>
